<body><main><div class="eyebrow">Idea 4 . background</div><h1>What Canary is (and what it is not)</h1><p class="note">Canary is software only. It runs on a Windows PC and has no sensors. Devices and scripts send it values; it stores each value with a time and a quality flag, calculates new values and alarms from them, and shows them on dashboards.</p>
